name: FPL Vortex Bot

# Near real-time confirmed-news monitor.
# GitHub scheduling is best-effort; Python owns freshness, deduplication and
# posting limits. The publication engine remains fail-closed and will never
# publish an unverified event.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: write
  actions: write  # required for the cache-pruning step (gh cache delete)

concurrency:
  group: fpl-vortex-bot
  cancel-in-progress: false
jobs:
  run-bot:
    if: ${{ vars.BOT_PAUSED != 'true' }}
    runs-on: ubuntu-latest

    env:
      BOT_PAUSED: ${{ vars.BOT_PAUSED }}

    steps:
      - name: Enable near real-time monitor
        id: window
        run: |
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "Checking for new official confirmed PL transfer/injury/suspension stories."

      - name: Checkout
        if: steps.window.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Restore V2 verification database
        if: steps.window.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: data/verification.sqlite3
          # The exact key is unique per run on purpose — actions/cache only
          # re-saves on a miss, and this DB is written to on every run, so a
          # static key would restore once and then silently stop updating.
          # restore-keys below still pulls the most recently *saved* cache
          # on every run via prefix match, so the DB carries forward
          # correctly. What was missing was any cleanup of old entries —
          # see "Prune old verification-db caches" below.
          key: verification-v2-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            verification-v2-${{ github.repository_id }}-

      - name: Prune old verification-db caches
        if: steps.window.outputs.should_run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every run saves a brand-new cache entry (see note above), so
          # without cleanup these accumulate ~72/day, forever. Once total
          # repo cache size crosses GitHub's 10GB cap, GitHub starts
          # evicting the OLDEST entries — usually harmless, but a large
          # enough burst (or bad luck) can evict the most recent one right
          # before this run tries to restore it. That reads to the app as
          # "database missing," and its fail-closed design means it will
          # silently post nothing for that entire run. Keeping only the
          # newest few caches keeps total size trivial and this scenario
          # from ever arising in practice.
          mapfile -t old_caches < <(
            gh cache list --repo "${{ github.repository }}" \
              --key "verification-v2-${{ github.repository_id }}-" \
              --sort created_at --order desc --json id --jq '.[].id' \
              | tail -n +6
          )
          for id in "${old_caches[@]:-}"; do
            [ -n "$id" ] && gh cache delete "$id" --repo "${{ github.repository }}" || true
          done

      - name: Set up Python
        if: steps.window.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.window.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Mandatory verification test gate
        if: steps.window.outputs.should_run == 'true'
        run: |
          python -m pytest -q

      - name: Run bot
        id: run
        if: steps.window.outputs.should_run == 'true'
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0_TOKEN: ${{ secrets.X_CT0_TOKEN }}
          X_POST_AUTH_TOKEN: ${{ secrets.X_POST_AUTH_TOKEN }}
          X_POST_CT0_TOKEN: ${{ secrets.X_POST_CT0_TOKEN }}
          ENABLE_AUTOPOST: ${{ vars.ENABLE_AUTOPOST || 'true' }}
          VERIFICATION_V2_LIVE: ${{ vars.VERIFICATION_V2_LIVE || 'true' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          VERIFICATION_V2_ALLOW_DB_REBUILD: ${{ vars.VERIFICATION_V2_ALLOW_DB_REBUILD }}
          # The dedicated deadline workflow owns the combined press roundup so
          # it is not published early while manager conferences are incomplete.
          LIVE_EVENT_SCOPE: transfer,loan,loan_option,injury,suspension
          SAVE_DRAFTS_TO_DISK: false
          MAX_POSTS_PER_RUN: 2
          MAX_POSTS_PER_HOUR: 4
          DAILY_POST_LIMIT: 16
          POST_JITTER_MIN_S: 90
          POST_JITTER_MAX_S: 240
          COOLDOWN_FLAGGED_MIN: 180
          COOLDOWN_RATELIMIT_MIN: 30

        run: |
          set +e
          python main.py
          code=$?
          if [ $code -ne 0 ]; then
            echo "First attempt failed (exit $code) — retrying once after 30s"
            sleep 30
            python main.py
            code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Save generated cards for inspection
        if: always() && steps.window.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cards-${{ github.run_id }}
          retention-days: 5
          if-no-files-found: ignore
          path: |
            queue/pending/*.png
            queue/dryrun/*.png

      - name: Save run status for inspection
        # data/last_run_status.json (gitignored on purpose — it's per-run,
        # not durable state) records exactly why a run did or didn't post
        # (no_post_reason, live_authorized, database_was_empty, feed health,
        # etc). Previously this only ever existed on the ephemeral runner
        # and was lost the moment the job ended, so diagnosing "why didn't
        # it post" meant reading through main.py by hand. Uploading it here
        # makes it a one-click download from the run summary instead.
        if: always() && steps.window.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: run-status-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: data/last_run_status.json

      - name: Verification V2 shadow report
        if: steps.window.outputs.should_run == 'true'
        run: python tools/v2_report.py || true

      - name: Persist state (dedup, daily count, deferred queue)
        if: steps.window.outputs.should_run == 'true'
        run: |
          git config user.name "fpl-vortex-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/posted_news.json 2>/dev/null || true
          git add posted_news.json fpl_player_state.json 2>/dev/null || true
          git add data/club_feeds.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "update bot state [skip ci]"
            pushed=""
            for i in 1 2 3 4 5; do
              if git push; then pushed=1; break; fi
              echo "push rejected (attempt $i) — rebasing on origin/main and retrying"
              git pull --rebase --autostash -X ours origin main || git rebase --abort || true
              sleep 3
            done
            if [ -z "$pushed" ]; then
              echo "WARNING: could not push bot state after retries; will re-attempt next run."
            fi
          fi
