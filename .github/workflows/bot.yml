name: FPL Vortex Bot

# Post exactly twice a day: 6:00 AM and 7:00 PM Eastern Time.
#
# GitHub Actions cron is UTC-only and cannot express timezones or DST, so we
# schedule the four possible UTC instants that map to 6:00 and 19:00 Eastern
# (EDT = UTC-4 and EST = UTC-5) and let the "posting window" guard below keep
# exactly the two that match the current local time. This is set-and-forget:
# no manual cron edit when DST flips.
on:
  schedule:
    - cron: "0 10 * * *"    # 6:00 AM EDT (summer)
    - cron: "0 11 * * *"    # 6:00 AM EST (winter)
    - cron: "0 23 * * *"    # 7:00 PM EDT (summer)
    - cron: "0 0 * * *"     # 7:00 PM EST (winter)
  workflow_dispatch: {}     # manual runs always proceed, no window check

permissions:
  contents: write

concurrency:
  group: fpl-vortex-bot
  cancel-in-progress: false
jobs:
  run-bot:
    if: ${{ vars.BOT_PAUSED != 'true' }}
    runs-on: ubuntu-latest

    env:
      BOT_PAUSED: ${{ vars.BOT_PAUSED }}

    steps:
      - name: Check posting window (6AM / 7PM America/New_York)
        id: window
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # GitHub scheduled jobs can start late. Do NOT decide using the
            # runner's current hour, or a delayed 6AM ET run may be skipped at
            # 7AM/8AM. Instead, use the cron expression that triggered the event
            # plus the current Eastern offset to keep exactly two effective runs
            # per day through DST.
            SCHEDULE="${{ github.event.schedule }}"
            ET_OFFSET="$(TZ=America/New_York date +%z)"
            if [[ "$ET_OFFSET" == "-0400" && ( "$SCHEDULE" == "0 10 * * *" || "$SCHEDULE" == "0 23 * * *" ) ]] ||                [[ "$ET_OFFSET" == "-0500" && ( "$SCHEDULE" == "0 11 * * *" || "$SCHEDULE" == "0 0 * * *" ) ]]; then
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "Scheduled posting slot $SCHEDULE is active for ET offset $ET_OFFSET — proceeding."
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "Scheduled slot $SCHEDULE is inactive for ET offset $ET_OFFSET — skipping duplicate DST guard run."
            fi
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.window.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Restore V2 verification database
        if: steps.window.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: data/verification.sqlite3
          key: verification-v2-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            verification-v2-${{ github.repository_id }}-

      - name: Set up Python
        if: steps.window.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.window.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Mandatory verification test gate
        if: steps.window.outputs.should_run == 'true'
        run: |
          python -m pytest -q

      - name: Run bot
        id: run
        if: steps.window.outputs.should_run == 'true'
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0_TOKEN: ${{ secrets.X_CT0_TOKEN }}
          X_POST_AUTH_TOKEN: ${{ secrets.X_POST_AUTH_TOKEN }}
          X_POST_CT0_TOKEN: ${{ secrets.X_POST_CT0_TOKEN }}
          # Safe defaults: both variables must be explicitly configured before
          # V2 can publish. BOT_PAUSED remains the emergency kill switch.
          ENABLE_AUTOPOST: ${{ vars.ENABLE_AUTOPOST }}
          VERIFICATION_V2_LIVE: ${{ vars.VERIFICATION_V2_LIVE }}
          VERIFICATION_V2_ALLOW_DB_REBUILD: ${{ vars.VERIFICATION_V2_ALLOW_DB_REBUILD }}
          SAVE_DRAFTS_TO_DISK: false
          # Volume: 2 runs/day (6AM + 7PM ET) x 8 verified stories = up to 16/day.
          # Pacing is the anti-flag mechanism: posts go out one at a time with
          # human-like jitter below, and the X-safety cooldown stops the run
          # entirely if X signals automation/rate-limit (codes 226/326/429...).
          MAX_POSTS_PER_RUN: 8
          MAX_POSTS_PER_HOUR: 10
          DAILY_POST_LIMIT: 16
          POST_JITTER_MIN_S: 60
          POST_JITTER_MAX_S: 150
          COOLDOWN_FLAGGED_MIN: 180
          COOLDOWN_RATELIMIT_MIN: 30

        run: |
          set +e
          python main.py
          code=$?
          if [ $code -ne 0 ]; then
            echo "First attempt failed (exit $code) — retrying once after 30s"
            sleep 30
            python main.py
            code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Verification V2 shadow report
        if: steps.window.outputs.should_run == 'true'
        run: python tools/v2_report.py || true

      - name: Persist state (dedup, daily count, deferred queue)
        if: steps.window.outputs.should_run == 'true'
        run: |
          git config user.name "fpl-vortex-bot"
          git config user.email "bot@users.noreply.github.com"
          # Persist only the compact compatibility JSON ledger. V2 SQLite is
          # restored/saved by actions/cache; generated cards and logs are not
          # committed, preventing continued repository growth.
          git add data/posted_news.json 2>/dev/null || true
          git add posted_news.json fpl_player_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "update bot state [skip ci]"
            # Rebase-then-push with retries so a concurrent push to main (e.g. a
            # merge landing mid-run) can't fail the job. Keep OUR bot-state files
            # on conflict — they are the freshest dedup/queue snapshot.
            pushed=""
            for i in 1 2 3 4 5; do
              if git push; then pushed=1; break; fi
              echo "push rejected (attempt $i) — rebasing on origin/main and retrying"
              git pull --rebase --autostash -X ours origin main || git rebase --abort || true
              sleep 3
            done
            if [ -z "$pushed" ]; then
              echo "WARNING: could not push bot state after retries; will re-attempt next run."
            fi
          fi
