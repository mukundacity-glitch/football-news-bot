name: 03 - FPL Daily Strategy (8 AM, 12 PM, 5 PM ET)

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: America/New_York
    - cron: '0 12 * * *'
      timezone: America/New_York
    - cron: '0 17 * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      slot:
        description: Post edition
        type: choice
        options: [morning, lunch, evening]
        default: morning
        required: true
      dry_run:
        description: Generate package without posting to X
        type: boolean
        default: true
        required: true
  pull_request:
    paths:
      - .github/workflows/fpl-mini-league-edge.yml
      - src/fpl_mini_league_edge.py
      - tests/test_fpl_mini_league_edge.py
      - config/fpl_mini_league_edge_prompt.md
      - assets/branding/fpl_strategy_logo.png
  push:
    branches: [main]
    paths:
      - .github/workflows/fpl-mini-league-edge.yml
      - src/fpl_mini_league_edge.py
      - tests/test_fpl_mini_league_edge.py
      - config/fpl_mini_league_edge_prompt.md
      - assets/branding/fpl_strategy_logo.png

permissions:
  contents: read

concurrency:
  group: fpl-mini-league-edge
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_fpl_mini_league_edge.py -v

  generate-and-publish:
    permissions:
      contents: write
    needs: verify
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      vars.FPL_EDGE_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FPL_EDGE_TEXT_MODEL: ${{ vars.FPL_EDGE_TEXT_MODEL || 'gpt-5.5' }}
      FPL_EDGE_IMAGE_MODEL: ${{ vars.FPL_EDGE_IMAGE_MODEL || 'gpt-image-2' }}
      X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
      X_CT0_TOKEN: ${{ secrets.X_CT0_TOKEN }}
      X_POST_AUTH_TOKEN: ${{ secrets.X_POST_AUTH_TOKEN }}
      X_POST_CT0_TOKEN: ${{ secrets.X_POST_CT0_TOKEN }}
      FPL_EDGE_SLOT: ${{ inputs.slot }}
      FPL_EDGE_SCHEDULE: ${{ github.event.schedule }}
      FPL_EDGE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Create package and post when enabled
        run: python -m src.fpl_mini_league_edge --sync-state
      - name: Downloadable graphics, captions and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpl-mini-league-edge-${{ github.run_id }}
          path: output/fpl-mini-league-edge/
          if-no-files-found: ignore
          retention-days: 90
