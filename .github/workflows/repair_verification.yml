name: Repair verification policy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove hard-coded non-official publication block
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/verification/engine.py')
          s = p.read_text()
          old = '''        if event in {EventType.TRANSFER, EventType.PRESS_CONFERENCE}:\n            return [], "none"\n'''
          if old in s:
              s = s.replace(old, '', 1)
          p.write_text(s)
          PY

      - name: Enable trusted non-official single-source publishing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('config/verification.json')
          data = json.loads(p.read_text())
          policy = data['policy']
          policy['allow_non_official_confirmation'] = True
          policy['minimum_independent_publishers'] = 1
          policy['official_first_party_sufficient'] = True
          policy['require_corroboration_with_official'] = False
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/verification/engine.py config/verification.json
          if git diff --cached --quiet; then
            echo 'No repair changes needed.'
          else
            git commit -m 'Remove hard-coded verification publication restriction'
            git push
          fi
