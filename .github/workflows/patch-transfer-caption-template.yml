name: Patch transfer caption fixed template

on:
  push:
    branches: ["fix/transfer-caption-fixed-template"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/transfer-caption-fixed-template
      - name: Apply text-only transfer template patch
        run: python tools/patch_transfer_template_once.py
      - name: Commit patched production text and tests
        run: |
          if git diff --quiet -- src/verification/renderer.py tests/test_caption_master_templates.py tests/test_verification_v2.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/verification/renderer.py tests/test_caption_master_templates.py tests/test_verification_v2.py
          git commit -m "Lock transfer caption to fixed reported template"
          git push origin HEAD:fix/transfer-caption-fixed-template
