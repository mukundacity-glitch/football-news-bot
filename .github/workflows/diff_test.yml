name: Verification V2 Test Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Match bot.yml. The card tests assert a real 3840x2160 render, and
          # without a browser the renderer falls back to a 1380x776 PIL card —
          # so this gate was measuring the fallback, not the thing that ships.
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Compile Python sources
        run: python -m compileall -q main.py src tools

      - name: Run complete test suite
        run: python -m pytest -q

      - name: Run historical diff gate
        run: python tools/diff_test_gate.py
