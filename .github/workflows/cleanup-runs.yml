name: Delete old workflow runs

on:
  # One-time full cleanup is triggered by this cleanup-policy push to main.
  # The path filter prevents normal bot/state pushes from retriggering it.
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-runs.yml'
  schedule:
    - cron: '0 0 * * 0' # Weekly maintenance after the one-time cleanup.
  workflow_dispatch: # Allows manual maintenance runs.

jobs:
  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          # On the cleanup-policy push, delete all completed historical runs. Future
          # scheduled/manual maintenance keeps the previous 3-day / 5-run policy.
          retain_days: ${{ github.event_name == 'push' && '0' || '3' }}
          keep_minimum_runs: ${{ github.event_name == 'push' && '0' || '5' }}
