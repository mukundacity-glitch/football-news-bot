name: One-off player image fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-player-image-once.yml'

permissions:
  contents: write

jobs:
  fix-player-image:
    if: github.event.head_commit.message != 'Fix player image rendering without cropping'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply only the player-image rendering fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one target block, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 1) Preserve the original FPL/FotMob/Wikipedia player image intact.
          replace_once(
              "src/rendering/assets.py",
              'CACHE = Path(".cache/render_assets")\n_STANDARD_HEADSHOT_SOURCES = {"FPL API", "Reliable provider"}\n_HEADSHOT_HEIGHT_RATIO = 0.44\n',
              'CACHE = Path(".cache/render_assets")\n',
          )

          replace_once(
              "src/rendering/assets.py",
              '''def identity_safe_portrait(image: Image.Image, source: str) -> Image.Image:\n    """Remove unverified kit details from standardized provider portraits.\n\n    FPL and provider identity photos can remain cached in a player's former\n    club shirt after a transfer. Their face is still useful identity evidence,\n    but the shirt, crest and sponsor are not current-team evidence. Crop every\n    standardized portrait to a headshot for every event type; current club\n    identity is rendered separately from the verified live team data.\n    """\n    portrait = image.convert("RGBA")\n    if source not in _STANDARD_HEADSHOT_SOURCES:\n        return portrait\n    crop_h = max(1, min(portrait.height, round(portrait.height * _HEADSHOT_HEIGHT_RATIO)))\n    return portrait.crop((0, 0, portrait.width, crop_h))\n''',
              '''def identity_safe_portrait(image: Image.Image, source: str) -> Image.Image:\n    """Preserve the verified source image without cropping or reshaping it."""\n    return image.convert("RGBA")\n''',
          )

          # 2) Remove the circular/square headshot path. Keep the exact existing
          #    right-hand image box and use proportional contain for real images.
          replace_once(
              "src/rendering/engine.py",
              'from PIL import Image, ImageChops, ImageDraw, ImageEnhance, ImageOps',
              'from PIL import Image, ImageDraw, ImageEnhance, ImageOps',
          )

          old_engine = '''        if player:\n            player = identity_safe_portrait(player, image_source)\n            alpha = player.getchannel("A") if player.mode == "RGBA" else None\n            transparent = bool(alpha and alpha.getextrema()[0] < 10)\n            standardized_headshot = image_source in {"FPL API", "Reliable provider"}\n            if standardized_headshot:\n                # Standard provider portraits are cropped to identity-only pixels\n                # by identity_safe_portrait(). Present the result inside a large\n                # circular frame so the safety crop never looks like a floating\n                # rectangular strip and remains prominent in the X phone preview.\n                photo_top = y1 + 275\n                photo_bottom = y2 - 235\n                diameter = min(inner[2]-inner[0]-130, photo_bottom-photo_top)\n                diameter = max(620, diameter)\n                hx = (inner[0]+inner[2])//2\n                hy = (photo_top+photo_bottom)//2\n                head_box = (hx-diameter//2, hy-diameter//2, hx+diameter//2, hy+diameter//2)\n                draw.ellipse(\n                    (head_box[0]-22, head_box[1]-22, head_box[2]+22, head_box[3]+22),\n                    fill=(0, 0, 0), outline=style.banner, width=18,\n                )\n                fitted = ImageOps.fit(\n                    player.convert("RGBA"), (diameter, diameter),\n                    method=Image.Resampling.LANCZOS, centering=(0.5, 0.5),\n                )\n                circle = Image.new("L", (diameter, diameter), 0)\n                ImageDraw.Draw(circle).ellipse((0, 0, diameter-1, diameter-1), fill=255)\n                if fitted.getchannel("A").getextrema()[0] < 255:\n                    circle = ImageChops.multiply(circle, fitted.getchannel("A"))\n                image.paste(fitted, (head_box[0], head_box[1]), circle)\n                draw.ellipse(head_box, outline=CYAN, width=8)\n            elif transparent:\n                shirt_fallback = image_source == "Team shirt fallback"\n                max_w = int((inner[2]-inner[0]) * (0.76 if shirt_fallback else 0.96))\n                max_h = int((inner[3]-inner[1]) * (0.76 if shirt_fallback else 0.94))\n                scale = min(max_w / max(1, player.width), max_h / max(1, player.height))\n                # Official/FotMob headshots are often only 250px. They are still\n                # the highest-priority verified identity image, so upscale with\n                # Lanczos and center rather than leaving a tiny head at the foot.\n                resized = player.resize(\n                    (max(1, round(player.width*scale)), max(1, round(player.height*scale))),\n                    Image.Resampling.LANCZOS,\n                )\n                px = inner[0] + (inner[2]-inner[0]-resized.width)//2\n                if shirt_fallback:\n                    py = inner[1] + (inner[3]-inner[1]-resized.height)//2 + 35\n                elif resized.height <= resized.width * 1.15:\n                    py = inner[1] + (inner[3]-inner[1]-resized.height)//2\n                else:\n                    py = inner[3] - resized.height\n                image.paste(resized, (px, py), resized)\n            else:\n                paste_cover(image, player, inner, rounded=18)\n'''

          new_engine = '''        if player:\n            player = identity_safe_portrait(player, image_source)\n            if image_source == "Team shirt fallback":\n                # Keep the existing team-shirt fallback presentation unchanged.\n                max_w = int((inner[2]-inner[0]) * 0.76)\n                max_h = int((inner[3]-inner[1]) * 0.76)\n                scale = min(max_w / max(1, player.width), max_h / max(1, player.height))\n                resized = player.resize(\n                    (max(1, round(player.width*scale)), max(1, round(player.height*scale))),\n                    Image.Resampling.LANCZOS,\n                )\n                px = inner[0] + (inner[2]-inner[0]-resized.width)//2\n                py = inner[1] + (inner[3]-inner[1]-resized.height)//2 + 35\n                image.paste(resized, (px, py), resized)\n            else:\n                # Real verified player images keep their complete source frame and\n                # natural aspect ratio inside the existing right-hand image area.\n                paste_contain(image, player, inner)\n'''
          replace_once("src/rendering/engine.py", old_engine, new_engine)

          # 3) Update only the regression that encoded yesterday's forced crop.
          replace_once(
              "tests/test_player_card_design.py",
              '''def test_fpl_portrait_removes_unverified_old_kit_for_every_card_type():\n    portrait = Image.new("RGBA", (500, 500), (0, 0, 0, 0))\n    # Face/head area and an intentionally unmistakable former-club shirt area.\n    portrait.paste((20, 180, 240, 255), (0, 0, 500, 220))\n    portrait.paste((255, 210, 0, 255), (0, 220, 500, 500))\n\n    safe = assets.identity_safe_portrait(portrait, "FPL API")\n\n    assert safe.size == (500, 220)\n    assert (255, 210, 0, 255) not in {\n        color for _count, color in (safe.getcolors(maxcolors=1_000_000) or [])\n    }\n''',
              '''def test_verified_player_portrait_keeps_original_image_intact():\n    portrait = Image.new("RGBA", (500, 500), (0, 0, 0, 0))\n    portrait.paste((20, 180, 240, 255), (0, 0, 500, 220))\n    portrait.paste((255, 210, 0, 255), (0, 220, 500, 500))\n\n    safe = assets.identity_safe_portrait(portrait, "FPL API")\n\n    assert safe.size == portrait.size\n    assert safe.tobytes() == portrait.tobytes()\n''',
          )

          engine_text = Path("src/rendering/engine.py").read_text(encoding="utf-8")
          assets_text = Path("src/rendering/assets.py").read_text(encoding="utf-8")

          # Guard the exact requested scope.
          assert 'inner = (x1+25, y1+30, x2-25, y2-70)' in engine_text
          assert 'standardized_headshot' not in engine_text
          assert 'head_box' not in engine_text
          assert 'ImageChops' not in engine_text
          assert 'paste_cover(image, player, inner' not in engine_text
          assert 'paste_contain(image, player, inner)' in engine_text
          assert '_HEADSHOT_HEIGHT_RATIO' not in assets_text

          # Priority/fallback resolver must remain untouched.
          fpl_pos = assets_text.index('return image, "FPL API"')
          wiki_pos = assets_text.index('return image, "Wikipedia"')
          fotmob_pos = assets_text.index('return image, "Reliable provider"')
          shirt_pos = assets_text.index('return shirt, "Team shirt fallback"')
          assert fpl_pos < wiki_pos < fotmob_pos < shirt_pos
          PY

      - name: Verify focused player-image tests
        shell: bash
        run: |
          python -m pip install -q -r requirements.txt pytest
          python -m pytest -q tests/test_player_card_design.py

      - name: Commit the fix and remove this one-off workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-player-image-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rendering/assets.py src/rendering/engine.py tests/test_player_card_design.py .github/workflows/fix-player-image-once.yml
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Fix player image rendering without cropping"
          git push origin HEAD:main
