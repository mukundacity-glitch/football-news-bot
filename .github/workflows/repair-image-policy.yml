name: Repair verified player image pipeline

on:
  push:
    branches:
      - safe-transfer-consolidation-2026-08

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'repair verified image pipeline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: safe-transfer-consolidation-2026-08

      - name: Remove unsafe image fallbacks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/renderer.py')
          text = path.read_text()
          start = text.index('def _img_assets(story):')
          end = text.index('\n\n# X rejects PNG uploads over 5 MB.', start)

          replacement = '''def _img_assets(story):
              """Resolve a player image only from identity-verified sources.

              Policy: FPL's canonical player asset is preferred. Wikipedia is the
              only fallback and is accepted only after the page is independently
              verified as the requested footballer. Article/media URLs, ESPN/BBC/
              FotMob search results and club crests are never treated as player
              photos because a visually plausible but wrong face is worse than no
              photo on a verified-news card.
              """
              fpl = fetch_fpl_data()
              player_el = find_player_in_fpl(story.get("player"), fpl)
              player_name = (story.get("display_name")
                             or (player_el["web_name"] if player_el else story.get("player"))
                             or "PLAYER")

              logo_uri = _data_uri(Path("Logo.png"))
              photo_uri = ""

              # 1) Canonical FPL player identity/asset.
              pid = player_el.get("code") if player_el else None
              if pid:
                  pp = Path(f"players/{pid}.png")
                  if not pp.exists():
                      _download_asset(
                          f"https://resources.premierleague.com/premierleague/photos/players/250x250/p{pid}.png",
                          pp,
                      )
                  photo_uri = _data_uri(pp)

              # 2) Verified Wikipedia identity fallback only.
              # Never use a raw article/media URL merely because it was attached
              # to the story: the source image may be a teammate, manager or logo.
              if not photo_uri:
                  pname = story.get("player", "")
                  if pname:
                      image_url = _wikipedia_player_image(pname)
                      if image_url:
                          wp = Path("players/wiki_" + hashlib.md5(pname.encode()).hexdigest()[:12] + ".jpg")
                          if not wp.exists():
                              _download_asset(image_url, wp)
                          if wp.exists() and wp.stat().st_size > 500:
                              photo_uri = _data_uri(wp)
                              print(f"  [PHOTO] Verified Wikipedia image found for {pname!r}")

              if not photo_uri:
                  print(f"  [PHOTO] No identity-verified image available for {player_name!r}; using neutral silhouette.")

              return player_el, player_name, logo_uri, photo_uri
          '''

          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Add image safety regression tests
        run: |
          cat > tests/test_renderer_image_safety.py <<'PY'
          from pathlib import Path

          RENDERER = Path('src/renderer.py').read_text()

          def test_renderer_never_uses_story_media_as_player_identity():
              assert 'story.get("media_url")' not in RENDERER

          def test_renderer_has_no_unverified_search_provider_fallbacks():
              block = RENDERER[RENDERER.index('def _img_assets(story):'):RENDERER.index('\n\n# X rejects PNG uploads over 5 MB.')]
              assert 'espncdn.com' not in block
              assert 'bbc.co.uk/sport/football/players' not in block
              assert 'fotmob.com/api/search' not in block
              assert 'crest fallback' not in block.lower()

          def test_renderer_keeps_verified_wikipedia_fallback():
              block = RENDERER[RENDERER.index('def _img_assets(story):'):RENDERER.index('\n\n# X rejects PNG uploads over 5 MB.')]
              assert '_wikipedia_player_image' in block
              assert 'neutral silhouette' in block.lower()
          PY

      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "fpl-vortex-bot"
          git config user.email "bot@users.noreply.github.com"
          rm -f .github/workflows/repair-image-policy.yml
          git add src/renderer.py tests/test_renderer_image_safety.py .github/workflows/repair-image-policy.yml
          git commit -m "repair verified image pipeline"
          git push origin safe-transfer-consolidation-2026-08
