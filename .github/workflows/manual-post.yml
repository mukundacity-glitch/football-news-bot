name: FPL Vortex Manual Verified Post

on:
  workflow_dispatch:
    inputs:
      story_id:
        description: "V2 story ID selected from the desktop dashboard"
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: fpl-vortex-manual-post
  cancel-in-progress: false

jobs:
  post-selected-story:
    if: ${{ vars.BOT_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore V2 verification database
        uses: actions/cache@v4
        with:
          path: data/verification.sqlite3
          key: verification-v2-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            verification-v2-${{ github.repository_id }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Mandatory verification test gate
        run: python -m pytest -q

      - name: Re-verify and post selected story only
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0_TOKEN: ${{ secrets.X_CT0_TOKEN }}
          X_POST_AUTH_TOKEN: ${{ secrets.X_POST_AUTH_TOKEN }}
          X_POST_CT0_TOKEN: ${{ secrets.X_POST_CT0_TOKEN }}
          ENABLE_AUTOPOST: ${{ vars.ENABLE_AUTOPOST || 'true' }}
          VERIFICATION_V2_LIVE: ${{ vars.VERIFICATION_V2_LIVE || 'true' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          VERIFICATION_V2_ALLOW_DB_REBUILD: ${{ vars.VERIFICATION_V2_ALLOW_DB_REBUILD }}
          LIVE_EVENT_SCOPE: transfer,loan,loan_option,injury,suspension
          SAVE_DRAFTS_TO_DISK: false
          MAX_POSTS_PER_RUN: 1
          MAX_POSTS_PER_HOUR: 4
          DAILY_POST_LIMIT: 16
          POST_JITTER_MIN_S: 90
          POST_JITTER_MAX_S: 240
          COOLDOWN_FLAGGED_MIN: 180
          COOLDOWN_RATELIMIT_MIN: 30
        run: python tools/manual_post.py --story-id "${{ inputs.story_id }}"

      - name: Persist state
        if: always()
        run: |
          git config user.name "fpl-vortex-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/posted_news.json posted_news.json fpl_player_state.json data/club_feeds.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "update bot state [skip ci]"
            git pull --rebase --autostash -X ours origin main || true
            git push || true
          fi
