name: Patch guarded transfer free-agent lane

on:
  push:
    branches:
      - fix/transfer-duplicate-origin-destination
    paths:
      - .github/workflows/patch-transfer-free-agent.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/transfer-duplicate-origin-destination
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply guarded fix
        run: python tools/apply_guarded_transfer_fix.py
      - name: Preserve existing final-gate origin semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/transfer_safety.py")
          text = p.read_text(encoding="utf-8")
          old = '''    if from_state == "UNKNOWN" and not free_transfer:\n        return "REJECT", "origin_missing"\n'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one temporary origin_missing block")
          p.write_text(text.replace(old, ""), encoding="utf-8")
          PY
      - name: Run full safety suite
        run: python -m pytest -q
      - name: Commit guarded fix
        run: |
          git config user.name "chatgpt-fix-bot"
          git config user.email "bot@users.noreply.github.com"
          git add main.py src/verification/extractor.py src/verification/engine.py src/verification/renderer.py src/rendering/engine.py src/transfer_safety.py tests/test_v2_free_transfer_lane.py
          git commit -m "Fix confirmed free-agent transfer verification"
          git push origin HEAD:fix/transfer-duplicate-origin-destination
