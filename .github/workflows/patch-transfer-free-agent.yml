name: Patch guarded transfer free-agent lane

on:
  push:
    branches:
      - fix/transfer-duplicate-origin-destination

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/transfer-duplicate-origin-destination
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply guarded fix and regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one patch target, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_one(
              'src/verification/extractor.py',
              '''            if grammatical_to:\n                if to_club and to_club.id != grammatical_to.id:\n                    warnings.append("destination_relationship_conflict_grounded_grammar")\n                else:\n                    to_club = grammatical_to\n\n        # A verified official club account/domain is itself evidence of club\n''',
              '''            if grammatical_to:\n                if to_club and to_club.id != grammatical_to.id:\n                    warnings.append("destination_relationship_conflict_grounded_grammar")\n                else:\n                    to_club = grammatical_to\n\n            # Free-agent announcements often name only the destination. The\n            # legacy parser can then place that same club in both slots. Clear\n            # only that duplicate when THIS document itself contains a grounded\n            # free-transfer cue. Every non-free duplicate stays a relationship\n            # conflict and therefore fails entity validation.\n            transfer_kind, transfer_kind_evidence = self.classifier.fact_value(\n                "transfer_kind", document.text\n            )\n            if from_club and to_club and from_club.id == to_club.id:\n                if transfer_kind == "free" and transfer_kind_evidence:\n                    from_club = None\n                    warnings.append("free_transfer_duplicate_origin_cleared")\n                else:\n                    warnings.append("origin_destination_relationship_conflict")\n\n        # A verified official club account/domain is itself evidence of club\n'''
          )

          replace_one(
              'src/verification/engine.py',
              '''        missing = []\n        unsupported = []\n        if policy:\n            for field in policy.required_facts:\n                if provisional_facts.get(field) in (None, ""):\n                    missing.append(field)\n                elif not any(field in claim.fact_support for claim in authoritative):\n                    unsupported.append(field)\n''',
              '''        missing = []\n        unsupported = []\n        required_fields = list(policy.required_facts) if policy else []\n        # A source-grounded free transfer has no current origin club to prove.\n        # This is a narrow alternative fact shape, not a weaker transfer gate:\n        # subject + destination + transfer_kind remain mandatory and the final\n        # transfer-safety layer independently re-checks the free-agent cue.\n        if (\n            event == EventType.TRANSFER\n            and normalize_fact(provisional_facts.get("transfer_kind")) == "free"\n        ):\n            required_fields = [\n                field for field in required_fields\n                if field not in {"club_from_id", "club_from_name"}\n            ]\n            if "transfer_kind" not in required_fields:\n                required_fields.append("transfer_kind")\n        if policy:\n            for field in required_fields:\n                if provisional_facts.get(field) in (None, ""):\n                    missing.append(field)\n                elif not any(field in claim.fact_support for claim in authoritative):\n                    unsupported.append(field)\n'''
          )

          replace_one(
              'src/transfer_safety.py',
              '''_SPEC_RE = [re.compile(p, re.I) for p in _POLICY["speculation_patterns"]]\n_DONE_RE = [re.compile(p, re.I) for p in _POLICY["completion_patterns"]]\n_ROUTE_RE = [re.compile(p, re.I) for p in _POLICY["route_evidence_patterns"]]\n_OFFICIAL_KINDS = set(_POLICY["official_source_kinds"])\n''',
              '''_SPEC_RE = [re.compile(p, re.I) for p in _POLICY["speculation_patterns"]]\n_DONE_RE = [re.compile(p, re.I) for p in _POLICY["completion_patterns"]]\n_ROUTE_RE = [re.compile(p, re.I) for p in _POLICY["route_evidence_patterns"]]\n_FREE_TRANSFER_RE = re.compile(\n    r"\\b(?:free transfer|free agent|on a free|out of contract|bosman)\\b", re.I\n)\n_OFFICIAL_KINDS = set(_POLICY["official_source_kinds"])\n'''
          )

          replace_one(
              'src/transfer_safety.py',
              '''    state, canonical = _resolved_fact_club(story, "to")\n    if state != "RESOLVED":\n        return "REJECT", f"destination_{state.lower()}"\n    from_state, from_canonical = _resolved_fact_club(story, "from")\n    if from_state == "AMBIGUOUS":\n        return "REJECT", "origin_ambiguous"\n    if from_state == "UNKNOWN" and story.get("club_from_id"):\n        return "REJECT", "origin_unknown"\n    if from_state == "RESOLVED" and from_canonical.lower() == canonical.lower():\n        return "REJECT", "origin_equals_destination"\n''',
              '''    state, canonical = _resolved_fact_club(story, "to")\n    if state != "RESOLVED":\n        return "REJECT", f"destination_{state.lower()}"\n    free_transfer = _normalize_phrase(story.get("transfer_kind")) == "free"\n    from_state, from_canonical = _resolved_fact_club(story, "from")\n    if from_state == "AMBIGUOUS":\n        return "REJECT", "origin_ambiguous"\n    if from_state == "UNKNOWN" and story.get("club_from_id"):\n        return "REJECT", "origin_unknown"\n    if from_state == "UNKNOWN" and not free_transfer:\n        return "REJECT", "origin_missing"\n    if from_state == "RESOLVED" and from_canonical.lower() == canonical.lower():\n        return "REJECT", "origin_equals_destination"\n'''
          )

          replace_one(
              'src/transfer_safety.py',
              '''    completed_authority = [\n        claim for claim in authoritative\n        if str(getattr(claim, "status", "")).split(".")[-1].upper()\n        in set(_POLICY["required_statuses"])\n    ]\n    if not any(\n''',
              '''    completed_authority = [\n        claim for claim in authoritative\n        if str(getattr(claim, "status", "")).split(".")[-1].upper()\n        in set(_POLICY["required_statuses"])\n    ]\n    if free_transfer and not any(\n        _FREE_TRANSFER_RE.search(_blob(claim)) for claim in completed_authority\n    ):\n        return "REJECT", "free_transfer_not_grounded"\n    if not any(\n'''
          )

          replace_one(
              'src/verification/renderer.py',
              '''        player = str(required(facts, "subject_name"))\n        origin = str(required(facts, "club_from_name"))\n        destination = str(required(facts, "club_to_name"))\n''',
              '''        player = str(required(facts, "subject_name"))\n        raw_kind = str(facts.get("transfer_kind") or "").strip().casefold()\n        free_transfer = raw_kind in {"free", "free transfer"}\n        origin_value = facts.get("club_from_name")\n        origin = (\n            str(origin_value) if origin_value\n            else "Free Agent" if free_transfer\n            else str(required(facts, "club_from_name"))\n        )\n        destination = str(required(facts, "club_to_name"))\n'''
          )

          replace_one(
              'src/verification/renderer.py',
              '''        raw_kind = str(facts.get("transfer_kind") or "").strip().casefold()\n        deal_type = "Loan" if "loan" in raw_kind else "Permanent"\n''',
              '''        deal_type = (\n            "Loan" if "loan" in raw_kind\n            else "Free Transfer" if free_transfer\n            else "Permanent"\n        )\n'''
          )

          replace_one(
              'src/rendering/engine.py',
              '''        origin = clean_text(facts.get("club_from_name"))\n        destination = clean_text(facts.get("club_to_name"))\n''',
              '''        raw_kind = str(facts.get("transfer_kind") or "").strip().casefold()\n        free_transfer = raw_kind in {"free", "free transfer"}\n        origin = clean_text(facts.get("club_from_name")) or (\n            "Free Agent" if free_transfer else ""\n        )\n        destination = clean_text(facts.get("club_to_name"))\n'''
          )

          replace_one(
              'main.py',
              '''    }.get(decision.event_type.value, item.get("event"))\n    if facts.get("club_from_name"):\n        item["from_club"] = facts["club_from_name"]\n        item["from_key"] = resolve_club_key(facts["club_from_name"])\n''',
              '''    }.get(decision.event_type.value, item.get("event"))\n    transfer_kind = str(facts.get("transfer_kind") or "").strip().casefold()\n    is_free_transfer = (\n        decision.event_type.value == "TRANSFER"\n        and transfer_kind in {"free", "free transfer"}\n    )\n    if is_free_transfer:\n        item["is_free"] = True\n        # Do not let an unverified legacy/parser origin leak back into the\n        # posting envelope when V2 intentionally verified a free-agent move.\n        if not facts.get("club_from_name"):\n            item["from_club"] = None\n            item["from_key"] = None\n    if facts.get("club_from_name"):\n        item["from_club"] = facts["club_from_name"]\n        item["from_key"] = resolve_club_key(facts["club_from_name"])\n'''
          )

          Path('tests/test_v2_free_transfer_lane.py').write_text(r'''from __future__ import annotations

from datetime import datetime, timezone

import main
from src.verification import VerificationRuntime
from src.verification.models import DecisionType


def _fpl():
    return {
        "teams": [
            {"id": 1, "name": "Chelsea", "short_name": "CHE"},
            {"id": 2, "name": "Brighton", "short_name": "BHA"},
        ],
        "elements": [
            {
                "id": 10,
                "first_name": "Example",
                "second_name": "Player",
                "web_name": "Player",
                "team": 1,
            }
        ],
    }


def _obs(text: str, *, source_id: str = "club.chelsea", free_hint: bool = False):
    now = datetime.now(timezone.utc).isoformat()
    story = {
        "player": "Example Player",
        "display_name": "Example Player",
        "event": "transfer",
        # Simulate the production parser bug: one named destination was copied
        # into both route slots before V2 independently grounds the document.
        "from_club": "Chelsea",
        "from_key": "Chelsea",
        "to_club": "Chelsea",
        "to_key": "Chelsea",
    }
    if free_hint:
        # A legacy hint alone must never authorize the free-agent exception.
        story["transfer_kind"] = "free"
    domain = "chelseafc.com" if source_id == "club.chelsea" else "bbc.com"
    return {
        "document": {
            "id": "free-transfer-test-" + str(abs(hash((text, source_id)))),
            "document_id": "free-transfer-test-" + str(abs(hash((text, source_id)))),
            "title": text,
            "summary": text,
            "text": text,
            "source_url": f"https://www.{domain}/football/{abs(hash(text))}",
            "source_id": source_id,
            "source_hint": source_id,
            "username": "chelseafc" if source_id == "club.chelsea" else "BBC_Sport",
            "transport": "DIRECT_RSS",
            "configured_direct_feed": True,
            "declared_sport": "football",
            "created_at": now,
            "published_at": now,
            "feed_id": "test.free.transfer",
        },
        "legacy_story": story,
    }


def test_official_grounded_free_transfer_can_publish_without_fake_origin(tmp_path):
    runtime = VerificationRuntime(fpl_data=_fpl(), database_path=tmp_path / "free.sqlite3")
    try:
        decision = runtime.verify_observations([_obs(
            "Chelsea have signed Example Player on a free transfer."
        )])
        assert decision.decision == DecisionType.PUBLISH, decision.reasons
        assert decision.may_publish
        assert decision.verified_facts["club_to_name"] == "Chelsea"
        assert decision.verified_facts["transfer_kind"] == "free"
        assert "club_from_id" not in decision.verified_facts
        assert "club_from_name" not in decision.verified_facts
        assert "Free Agent → Chelsea" in decision.rendered_text
        assert "Deal — Free Transfer" in decision.rendered_text
        safety = [g for g in decision.gates if g.name == "transfer_publication_safety"]
        assert safety and safety[-1].state.value == "PASS"
    finally:
        runtime.close()


def test_non_free_same_origin_destination_still_fails_closed(tmp_path):
    runtime = VerificationRuntime(fpl_data=_fpl(), database_path=tmp_path / "same.sqlite3")
    try:
        decision = runtime.verify_observations([_obs(
            "Chelsea have signed Example Player from Chelsea."
        )])
        assert not decision.may_publish
        assert decision.decision == DecisionType.REJECT
        assert any(
            g.name == "entity_validation" and g.state.value == "FAIL"
            for g in decision.gates
        )
    finally:
        runtime.close()


def test_legacy_free_hint_without_source_cue_cannot_bypass_origin_gate(tmp_path):
    runtime = VerificationRuntime(fpl_data=_fpl(), database_path=tmp_path / "hint.sqlite3")
    try:
        decision = runtime.verify_observations([_obs(
            "Chelsea have signed Example Player.", free_hint=True
        )])
        assert not decision.may_publish
        assert decision.decision != DecisionType.PUBLISH
        assert decision.verified_facts.get("transfer_kind") != "free"
    finally:
        runtime.close()


def test_media_free_transfer_remains_unconfirmed_and_cannot_publish(tmp_path):
    runtime = VerificationRuntime(fpl_data=_fpl(), database_path=tmp_path / "media.sqlite3")
    try:
        decision = runtime.verify_observations([_obs(
            "Chelsea have signed Example Player on a free transfer.",
            source_id="media.bbc_sport",
        )])
        assert not decision.may_publish
        assert decision.decision != DecisionType.PUBLISH
        assert any(
            g.name == "official_confirmation" and g.state.value != "PASS"
            for g in decision.gates
        )
    finally:
        runtime.close()


def test_projection_clears_unverified_legacy_origin_for_verified_free_move(tmp_path):
    runtime = VerificationRuntime(fpl_data=_fpl(), database_path=tmp_path / "projection.sqlite3")
    try:
        decision = runtime.verify_observations([_obs(
            "Chelsea have signed Example Player on a free transfer."
        )])
        assert decision.may_publish
        item = {
            "player": "Example Player",
            "event": "transfer",
            "from_club": "Chelsea",
            "from_key": "Chelsea",
            "to_club": "Chelsea",
            "to_key": "Chelsea",
        }
        main._v2_project_verified_facts(item, decision)
        assert item["is_free"] is True
        assert item["from_club"] is None
        assert item["from_key"] is None
        assert item["to_key"].lower() == "chelsea"
    finally:
        runtime.close()
''', encoding='utf-8')
          PY
      - name: Run full safety suite
        run: python -m pytest -q
      - name: Commit guarded fix
        run: |
          git config user.name "chatgpt-fix-bot"
          git config user.email "bot@users.noreply.github.com"
          git add main.py src/verification/extractor.py src/verification/engine.py src/verification/renderer.py src/rendering/engine.py src/transfer_safety.py tests/test_v2_free_transfer_lane.py
          git commit -m "Fix confirmed free-agent transfer verification"
          git push origin HEAD:fix/transfer-duplicate-origin-destination
