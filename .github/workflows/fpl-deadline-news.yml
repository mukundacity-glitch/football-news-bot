name: FPL Deadline Top-5 News

# Extra gameweek-only team-news check.
#
# The script itself decides whether this is the correct pre-deadline window:
#   FPL deadline = first PL kickoff - 90 minutes (official FPL timestamp)
#   Bot target   = FPL deadline - 30 minutes (kickoff - 2 hours)
#
# We poll every 15 minutes but do the expensive install/test/post work only
# inside that narrow target window. If no Top-5 official FPL availability news
# exists, the run exits without posting.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Manual test: run even outside the deadline window"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: fpl-vortex-bot
  cancel-in-progress: false

jobs:
  fpl-deadline-news:
    if: ${{ vars.BOT_PAUSED != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deadline window dependency
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check FPL deadline window
        id: window
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual_force" >> "$GITHUB_OUTPUT"
          else
            python tools/fpl_deadline_news.py --check-window --window-minutes 20 --margin-minutes 30 >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.window.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Mandatory verification test gate
        if: steps.window.outputs.should_run == 'true'
        run: python -m pytest -q

      - name: Run FPL deadline Top-5 news
        id: run
        if: steps.window.outputs.should_run == 'true'
        env:
          X_POST_AUTH_TOKEN: ${{ secrets.X_POST_AUTH_TOKEN }}
          X_POST_CT0_TOKEN: ${{ secrets.X_POST_CT0_TOKEN }}
          ENABLE_AUTOPOST: ${{ vars.ENABLE_AUTOPOST }}
          DAILY_POST_LIMIT: 16
          COOLDOWN_FLAGGED_MIN: 180
          COOLDOWN_RATELIMIT_MIN: 30
          FPL_DEADLINE_TOP_N: 5
          FPL_DEADLINE_CARD_LIMIT: 3
          FPL_DEADLINE_MARGIN_MINUTES: 30
          FPL_DEADLINE_WINDOW_MINUTES: 20
        run: |
          extra=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            extra="--force-window"
          fi
          python tools/fpl_deadline_news.py $extra

      - name: Persist FPL deadline state
        if: steps.window.outputs.should_run == 'true'
        run: |
          git config user.name "fpl-vortex-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/posted_news.json data/fpl_deadline_status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No FPL deadline state changes to commit."
          else
            git commit -m "update fpl deadline state [skip ci]"
            pushed=""
            for i in 1 2 3 4 5; do
              if git push; then pushed=1; break; fi
              echo "push rejected (attempt $i) — rebasing on origin/main and retrying"
              git pull --rebase --autostash -X ours origin main || git rebase --abort || true
              sleep 3
            done
            if [ -z "$pushed" ]; then
              echo "WARNING: could not push FPL deadline state after retries; will re-attempt next run."
            fi
          fi
