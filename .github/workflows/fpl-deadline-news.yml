name: FPL Deadline Press Conference Round-Up

# Publish one combined, officially verified PremierLeague.com press-conference
# graphic before the FPL deadline. The Python gate reads the official FPL lock
# time; cron only supplies repeated opportunities because GitHub schedules are
# best-effort.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run outside the deadline window (normal verification and dedup still apply)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: fpl-vortex-press-deadline
  cancel-in-progress: false

jobs:
  press-conference-roundup:
    if: ${{ vars.BOT_PAUSED != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check official FPL deadline window
        id: window
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual_force" >> "$GITHUB_OUTPUT"
          else
            python tools/press_deadline_window.py \
              --check-window --window-minutes 30 --margin-minutes 30 \
              >> "$GITHUB_OUTPUT"
          fi

      - name: Restore V2 verification database
        if: steps.window.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: data/verification.sqlite3
          key: verification-v2-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            verification-v2-${{ github.repository_id }}-

      - name: Install dependencies
        if: steps.window.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Mandatory verification test gate
        if: steps.window.outputs.should_run == 'true'
        run: python -m pytest -q

      - name: Run verified press-conference roundup
        id: run
        if: steps.window.outputs.should_run == 'true'
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0_TOKEN: ${{ secrets.X_CT0_TOKEN }}
          X_POST_AUTH_TOKEN: ${{ secrets.X_POST_AUTH_TOKEN }}
          X_POST_CT0_TOKEN: ${{ secrets.X_POST_CT0_TOKEN }}
          ENABLE_AUTOPOST: ${{ vars.ENABLE_AUTOPOST || 'true' }}
          VERIFICATION_V2_LIVE: ${{ vars.VERIFICATION_V2_LIVE || 'true' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          VERIFICATION_V2_ALLOW_DB_REBUILD: ${{ vars.VERIFICATION_V2_ALLOW_DB_REBUILD }}
          LIVE_EVENT_SCOPE: press_conference
          SAVE_DRAFTS_TO_DISK: false
          MAX_POSTS_PER_RUN: 1
          MAX_POSTS_PER_HOUR: 4
          DAILY_POST_LIMIT: 16
          POST_JITTER_MIN_S: 15
          POST_JITTER_MAX_S: 45
          COOLDOWN_FLAGGED_MIN: 180
          COOLDOWN_RATELIMIT_MIN: 30
        run: |
          set +e
          python main.py
          code=$?
          if [ $code -ne 0 ]; then
            echo "First attempt failed (exit $code) — retrying once after 30s"
            sleep 30
            python main.py
            code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Save generated roundup for inspection
        if: always() && steps.window.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: press-roundup-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: queue/pending/*.png

      - name: Save run status for inspection
        if: always() && steps.window.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: press-status-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: data/last_run_status.json

      - name: Persist dedup and publication state
        if: steps.window.outputs.should_run == 'true'
        run: |
          git config user.name "fpl-vortex-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/posted_news.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No press-roundup state changes to commit."
          else
            git commit -m "update press-roundup state [skip ci]"
            pushed=""
            for i in 1 2 3 4 5; do
              if git push; then pushed=1; break; fi
              echo "push rejected (attempt $i) — rebasing on origin/main and retrying"
              git pull --rebase --autostash -X ours origin main || git rebase --abort || true
              sleep 3
            done
            if [ -z "$pushed" ]; then
              echo "WARNING: could not push press-roundup state after retries."
            fi
          fi
