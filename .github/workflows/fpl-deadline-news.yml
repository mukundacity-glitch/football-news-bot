name: FPL Deadline Press Conference Round-Up

# Press conference only:
# - collect official PremierLeague.com roundup links throughout the gameweek
# - publish one verified combined graphic between 60 and 30 minutes before
#   the official FPL deadline
# The normal transfer/injury/suspension workflow is separate and untouched.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fpl-vortex-press-deadline
  cancel-in-progress: false

jobs:
  press-conference-roundup:
    if: ${{ vars.BOT_PAUSED != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect official press-conference links
        run: python tools/press_collection.py

      - name: Check press publication window
        id: window
        run: |
          python tools/press_deadline_window.py \
            --check-window --start-before-minutes 60 --end-before-minutes 30 \
            >> "$GITHUB_OUTPUT"

      - name: Restore V2 verification database
        if: steps.window.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: data/verification.sqlite3
          key: verification-v2-${{ github.repository_id }}-${{ github.run_id }}
          restore-keys: |
            verification-v2-${{ github.repository_id }}-

      - name: Install dependencies
        if: steps.window.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Mandatory press verification test gate
        if: steps.window.outputs.should_run == 'true'
        run: |
          python -m py_compile tools/press_collection.py tools/press_deadline_window.py tools/press_publish.py
          python -m pytest -q

      - name: Publish verified press-conference roundup
        id: run
        if: steps.window.outputs.should_run == 'true'
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0_TOKEN: ${{ secrets.X_CT0_TOKEN }}
          X_POST_AUTH_TOKEN: ${{ secrets.X_POST_AUTH_TOKEN }}
          X_POST_CT0_TOKEN: ${{ secrets.X_POST_CT0_TOKEN }}
          ENABLE_AUTOPOST: ${{ vars.ENABLE_AUTOPOST || 'true' }}
          VERIFICATION_V2_LIVE: ${{ vars.VERIFICATION_V2_LIVE || 'true' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          VERIFICATION_V2_ALLOW_DB_REBUILD: ${{ vars.VERIFICATION_V2_ALLOW_DB_REBUILD }}
          LIVE_EVENT_SCOPE: press_conference
          SAVE_DRAFTS_TO_DISK: false
          MAX_POSTS_PER_RUN: 1
          MAX_POSTS_PER_HOUR: 4
          DAILY_POST_LIMIT: 16
          POST_JITTER_MIN_S: 15
          POST_JITTER_MAX_S: 45
          COOLDOWN_FLAGGED_MIN: 180
          COOLDOWN_RATELIMIT_MIN: 30
        run: python tools/press_publish.py

      - name: Save generated roundup for inspection
        if: always() && steps.window.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: press-roundup-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: queue/pending/*.png

      - name: Save press status for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: press-status-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            data/press_conference_collection.json
            data/press_conference_status.json
            data/last_run_status.json

      - name: Persist press collection and publication state
        if: always()
        run: |
          git config user.name "fpl-vortex-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/press_conference_collection.json 2>/dev/null || true
          git add data/press_conference_status.json 2>/dev/null || true
          git add data/posted_news.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No press-conference state changes to commit."
          else
            git commit -m "update press-conference state [skip ci]"
            pushed=""
            for i in 1 2 3 4 5; do
              if git push; then pushed=1; break; fi
              echo "push rejected (attempt $i) — rebasing on origin/main and retrying"
              git pull --rebase --autostash -X ours origin main || git rebase --abort || true
              sleep 3
            done
            if [ -z "$pushed" ]; then
              echo "WARNING: could not push press-conference state after retries."
            fi
          fi
