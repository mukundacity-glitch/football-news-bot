name: Press Conference Window

# Windowed official press-conference monitor.
# GitHub scheduling is best-effort; Python owns the 3-hour deadline gate,
# verification, deduplication, and posting.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Manual test: run even outside the deadline window"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: fpl-vortex-bot
  cancel-in-progress: false

jobs:
  press-conference-news:
    if: ${{ vars.BOT_PAUSED != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deadline window dependency
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check FPL deadline window
        id: window
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual_force" >> "$GITHUB_OUTPUT"
          else
            python tools/fpl_deadline_news.py --check-window >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.window.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Mandatory verification test gate
        if: steps.window.outputs.should_run == 'true'
        run: python -m pytest -q

      - name: Run press conference bot
        id: run
        if: steps.window.outputs.should_run == 'true'
        env:
          X_POST_AUTH_TOKEN: ${{ secrets.X_POST_AUTH_TOKEN }}
          X_POST_CT0_TOKEN: ${{ secrets.X_POST_CT0_TOKEN }}
          ENABLE_AUTOPOST: ${{ vars.ENABLE_AUTOPOST || 'true' }}
          VERIFICATION_V2_LIVE: ${{ vars.VERIFICATION_V2_LIVE || 'true' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          VERIFICATION_V2_ALLOW_DB_REBUILD: ${{ vars.VERIFICATION_V2_ALLOW_DB_REBUILD }}
          PRESS_CONFERENCE_WINDOW_HOURS: 3
        run: |
          extra=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            extra="--force-window"
          fi
          python tools/fpl_deadline_news.py $extra

      - name: Save generated cards for inspection
        if: always() && steps.window.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cards-${{ github.run_id }}
          retention-days: 5
          if-no-files-found: ignore
          path: |
            queue/press_conference/*.png
            queue/pending/*.png
            queue/dryrun/*.png

      - name: Verification V2 shadow report
        if: steps.window.outputs.should_run == 'true'
        run: python tools/v2_report.py || true

      - name: Persist state (dedup, deadline ledger)
        if: steps.window.outputs.should_run == 'true'
        run: |
          git config user.name "fpl-vortex-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/press_conference_status.json 2>/dev/null || true
          git add data/posted_news.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "update press conference state [skip ci]"
            pushed=""
            for i in 1 2 3 4 5; do
              if git push; then pushed=1; break; fi
              echo "push rejected (attempt $i) — rebasing on origin/main and retrying"
              git pull --rebase --autostash -X ours origin main || git rebase --abort || true
              sleep 3
            done
            if [ -z "$pushed" ]; then
              echo "WARNING: could not push press conference state after retries; will re-attempt next run."
            fi
